[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specforge-analysis"
version = "0.1.0"
description = "SpecForge, участник 2: агенты анализа требований (этап 1) и системного анализа (этап 2)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "requests>=2.31",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
specforge-analysis = "specforge_analysis.cli:main"

[tool.setuptools.packages.find]
include = ["specforge_analysis*"]

[tool.setuptools.package-data]
specforge_analysis = ["prompts/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

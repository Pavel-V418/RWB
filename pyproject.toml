[project]
name = "specforge"
version = "0.1.0"
description = "SpecForge — агентный конвейер разработки (платформа)"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "langfuse>=5.1.0",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openai>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0",
    "python-gitlab>=8.6.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "rich>=15.0.0",
    "sse-starlette>=3.6.0",
    "structlog>=24.4",
    "typer>=0.12",
    "uvicorn>=0.54.0",
]

[project.scripts]
specforge = "specforge.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "types-docker>=7.1",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["specforge", "agents"]

[tool.ruff]
line-length = 100
target-version = "py312"
# main.py — заготовка IDE, к платформе не относится.
extend-exclude = ["main.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "C4", "PL"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # кириллица в строках, docstring и комментариях
    "PLR0913", "PLR0917",          # у команд typer и фабрик контекста много параметров
    "PLR2004",                     # числа в тестах
]

[tool.ruff.lint.isort]
known-first-party = ["specforge", "agents"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["specforge", "agents", "infra"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

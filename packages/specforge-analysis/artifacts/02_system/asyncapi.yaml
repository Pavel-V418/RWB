asyncapi: 3.0.0
info:
  title: 'Помощник управления платными парковками Санкт-Петербурга: события'
  version: 1.0.0
  description: 'Доставка at-least-once. Потребитель идемпотентен по eventId. Повторная обработка: 3 попытки с экспоненциальной
    задержкой (1, 5, 25 с), затем сообщение уходит в топик <address>.dlq. Несовместимое изменение схемы выпускается новой
    версией топика (.v2), старая версия поддерживается до миграции потребителей.'
defaultContentType: application/json
servers:
  kafka:
    host: kafka:9092
    protocol: kafka
    description: брокер в docker compose
channels:
  ParkingZoneEntered:
    address: parking.zone.entered.v1
    description: Автомобиль въехал в платную зону
    messages:
      ParkingZoneEntered:
        $ref: '#/components/messages/ParkingZoneEntered'
    x-dlq: parking.zone.entered.v1.dlq
  ParkingZoneExited:
    address: parking.zone.exited.v1
    description: Автомобиль покинул платную зону
    messages:
      ParkingZoneExited:
        $ref: '#/components/messages/ParkingZoneExited'
    x-dlq: parking.zone.exited.v1.dlq
  ParkingZoneChanged:
    address: parking.zone.changed.v1
    description: Автомобиль перешёл в другую платную зону
    messages:
      ParkingZoneChanged:
        $ref: '#/components/messages/ParkingZoneChanged'
    x-dlq: parking.zone.changed.v1.dlq
  ParkingSessionStarted:
    address: parking.session.started.v1
    description: Сессия запущена или подтверждена
    messages:
      ParkingSessionStarted:
        $ref: '#/components/messages/ParkingSessionStarted'
    x-dlq: parking.session.started.v1.dlq
  ParkingSessionExtended:
    address: parking.session.extended.v1
    description: Оплата сессии продлена
    messages:
      ParkingSessionExtended:
        $ref: '#/components/messages/ParkingSessionExtended'
    x-dlq: parking.session.extended.v1.dlq
  ParkingSessionExpiring:
    address: parking.session.expiring.v1
    description: До окончания оплаты осталось 10 минут или меньше
    messages:
      ParkingSessionExpiring:
        $ref: '#/components/messages/ParkingSessionExpiring'
    x-dlq: parking.session.expiring.v1.dlq
  ParkingSessionExpired:
    address: parking.session.expired.v1
    description: Оплаченный период истёк
    messages:
      ParkingSessionExpired:
        $ref: '#/components/messages/ParkingSessionExpired'
    x-dlq: parking.session.expired.v1.dlq
  ParkingSessionClosed:
    address: parking.session.closed.v1
    description: Сессия завершена
    messages:
      ParkingSessionClosed:
        $ref: '#/components/messages/ParkingSessionClosed'
    x-dlq: parking.session.closed.v1.dlq
operations:
  publishParkingZoneEntered:
    action: send
    channel:
      $ref: '#/channels/ParkingZoneEntered'
    messages:
    - $ref: '#/channels/ParkingZoneEntered/messages/ParkingZoneEntered'
    summary: Backend API публикует parking.zone.entered
    x-producer: Backend API
    x-consumers:
    - Background Worker
    - Backend API
  publishParkingZoneExited:
    action: send
    channel:

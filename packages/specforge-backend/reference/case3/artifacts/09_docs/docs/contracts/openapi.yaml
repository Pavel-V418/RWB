components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: ключ идемпотентности; повтор с тем же ключом возвращает первый результат
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    BadRequest:
      description: Ошибка валидации запроса
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Нет или истёк токен доступа
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Недостаточно прав для операции
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Ресурс не найден
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Конфликт состояния ресурса
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Нарушено бизнес-правило
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Превышен лимит запросов
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          description: через сколько секунд повторить
          schema:
            type: integer
    InternalError:
      description: Внутренняя ошибка
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Внешний сервис недоступен
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          maxLength: 50
          minLength: 1
          pattern: ^[a-zA-Z0-9._-]{3,50}$
        role:
          type: string
          enum:
          - warehouse_keeper
          - warehouse_manager
          - employee
          - system_admin
          default: employee
        employeeId:
          type: string
          format: uuid
        isActive:
          type: boolean
          default: true
        createdAt:
          type: string
          format: date-time
          description: время создания
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: время изменения
          readOnly: true
      additionalProperties: false
      required:
      - id
      - username
      - role
      - isActive
      - createdAt
      - updatedAt
      description: Учётная запись пользователя системы с ролью и привязкой к сотруднику
    Employee:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
          minLength: 1
        passNumber:
          type: string
          maxLength: 32
          minLength: 1
          pattern: ^[A-Z0-9-]{4,32}$
        createdAt:
          type: string
          format: date-time
          description: время создания
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: время изменения
          readOnly: true
      additionalProperties: false
      required:
      - id
      - name
      - passNumber
      - createdAt
      - updatedAt
      description: Сотрудник, получающий инструмент; данные загружаются из CSV-файла
    Tool:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        inventoryNumber:
          type: string
          maxLength: 50
          minLength: 1
          pattern: ^[A-Z0-9-]{3,50}$
        name:
          type: string
          maxLength: 200
          minLength: 1
        category:
          type: string
          maxLength: 100
          minLength: 1
        warehouse:
          type: string
          maxLength: 100
          minLength: 1
        status:
          type: string
          enum:
          - available
          - issued
          - reserved
          - repair
          - lost
          - retired
          default: available
        qrCode:
          type: string
          maxLength: 255
          minLength: 1
          readOnly: true
        createdAt:
          type: string
          format: date-time
          description: время создания
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: время изменения
          readOnly: true
      additionalProperties: false
      required:
      - id
      - inventoryNumber
      - name
      - category
      - warehouse
      - status
      - qrCode
      - createdAt
      - updatedAt
      description: Единица инструмента или оборудования в каталоге
    Reservation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        toolId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        status:
          type: string
          enum:
          - active
          - cancelled
          - fulfilled
          default: active
        createdAt:
          type: string
          format: date-time
          description: время создания
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: время изменения
          readOnly: true
      additionalProperties: false
      required:
      - id
      - toolId
      - employeeId
      - date
      - status
      - createdAt
      - updatedAt
      description: Бронирование инструмента на дату
    IssueRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        toolId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        issueDate:
          type: string
          format: date-time
        returnDeadline:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - active
          - returned
          - overdue
          default: active
        createdAt:
          type: string
          format: date-time
          description: время создания
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: время изменения
          readOnly: true
      additionalProperties: false
      required:
      - id
      - toolId
      - employeeId
      - issueDate
      - returnDeadline
      - status
      - createdAt
      - updatedAt
      description: Запись о выдаче инструмента сотруднику
    ReturnRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        issueRecordId:
          type: string
          format: uuid
        toolId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        returnDate:
          type: string
          format: date-time
        condition:
          type: string
          enum:
          - working
          - needs_repair
          - lost
        createdAt:
          type: string
          format: date-time
          description: время создания
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: время изменения
          readOnly: true
      additionalProperties: false
      required:
      - id
      - issueRecordId
      - toolId
      - employeeId
      - returnDate
      - condition
      - createdAt
      - updatedAt
      description: Запись о возврате инструмента с оценкой состояния
    MovementHistory:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        toolId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
          - created
          - issued
          - returned
          - reserved
          - reservation_cancelled
          - retired
        timestamp:
          type: string
          format: date-time
        userId:
          type: string
          format: uuid
        payload:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
          description: время создания
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: время изменения
          readOnly: true
      additionalProperties: false
      required:
      - id
      - toolId
      - eventType
      - timestamp
      - createdAt
      - updatedAt
      description: История движения каждой единицы инструмента
    SyncQueue:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        operationType:
          type: string
          enum:
          - issue
          - return
          - reservation
          - reservation_cancel
        payload:
          type: object
          additionalProperties: true
        status:
          type: string
          enum:
          - pending
          - synced
          - rejected
          default: pending
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: время изменения
          readOnly: true
      additionalProperties: false
      required:
      - id
      - operationType
      - payload
      - status
      - createdAt
      - updatedAt
      description: Очередь локальных операций для синхронизации после восстановления связи
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        userId:
          type: string
          format: uuid
        action:
          type: string
          maxLength: 100
          minLength: 1
        entityType:
          type: string
          maxLength: 50
          minLength: 1
        entityId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
          description: время создания
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: время изменения
          readOnly: true
      additionalProperties: false
      required:
      - id
      - action
      - entityType
      - timestamp
      - createdAt
      - updatedAt
      description: Журнал аудита действий пользователей
    SystemSetting:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        key:
          type: string
          maxLength: 100
          minLength: 1
        value:
          type: string
          maxLength: 500
          minLength: 1
        createdAt:
          type: string
          format: date-time
          description: время создания
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: время изменения
          readOnly: true
      additionalProperties: false
      required:
      - id
      - key
      - value
      - createdAt
      - updatedAt
      description: Настройки системы, включая срок возврата
    GeoJsonPoint:
      type: object
      description: GeoJSON Point, WGS 84 (EPSG:4326), порядок [долгота, широта]
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          const: Point
        coordinates:
          type: array
          minItems: 2
          maxItems: 2
          prefixItems:
          - type: number
            minimum: -180
            maximum: 180
          - type: number
            minimum: -90
            maximum: 90
    GeoJsonPolygon:
      type: object
      description: GeoJSON Polygon, WGS 84 (EPSG:4326)
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          const: Polygon
        coordinates:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 4
            items:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number
    GeoJsonLineString:
      type: object
      description: GeoJSON LineString, WGS 84 (EPSG:4326)
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          const: LineString
        coordinates:
          type: array
          minItems: 2
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
    Problem:
      type: object
      description: Единый формат ошибок, RFC 9457 (application/problem+json)
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri-reference
          example: /errors/validation
        title:
          type: string
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 2000
        instance:
          type: string
        code:
          type: string
          description: машиночитаемый код бизнес-ошибки
        traceId:
          type: string
          description: идентификатор трассировки для поиска в логах
        errors:
          type: array
          description: ошибки валидации по полям
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
    CreateToolRequest:
      type: object
      properties:
        inventoryNumber:
          type: string
          maxLength: 50
          minLength: 1
          pattern: ^[A-Z0-9-]{3,50}$
        name:
          type: string
          maxLength: 200
          minLength: 1
        category:
          type: string
          maxLength: 100
          minLength: 1
        warehouse:
          type: string
          maxLength: 100
          minLength: 1
        status:
          type: string
          enum:
          - available
          - issued
          - reserved
          - repair
          - lost
          - retired
          default: available
      additionalProperties: false
      required:
      - inventoryNumber
      - name
      - category
      - warehouse
      - status
    CreateReservationRequest:
      type: object
      properties:
        toolId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        date:
          type: string
          format: date
      additionalProperties: false
      required:
      - toolId
      - employeeId
      - date
    IssueToolRequest:
      type: object
      properties:
        toolId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        issueDate:
          type: string
          format: date-time
        returnDeadline:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - toolId
      - employeeId
      - issueDate
      - returnDeadline
    ReturnToolRequest:
      type: object
      properties:
        issueRecordId:
          type: string
          format: uuid

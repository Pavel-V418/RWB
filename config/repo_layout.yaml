# Раскладка артефактов прогона в итоговом репозитории — её используют публикатор GitLab
# (orchestrator/publisher.py) и приёмщик (agents/acceptance) при сборке репозитория.
#
# Файлы runs/<run_id>/artifacts/<stage>/ попадают в <каталог>/ ветки run/<run_id>.
# Значение этапа — каталог ("." — корень репозитория) или объект:
#   {dir: <каталог>, root: [<шаблоны>]} — файлы верхнего уровня этапа, совпавшие с шаблонами
#   (fnmatch), кладутся в корень репозитория: .gitlab-ci.yml (GitLab запускает CI только из
#   корня), docker-compose.yml, README.md с инструкцией запуска.
#   exclude: [<шаблоны>] — служебные файлы этапа (по пути внутри этапа), которые не публикуются.
# Этап без записи не публикуется (событие publish_warning), у приёмщика попадает в _unmapped/;
# `specforge doctor` показывает такие этапы. Имя ключа — AgentSpec.stage, не имя агента.
stages:
  input: docs/tz/            # ТЗ: оригинал и извлечённый текст

  # --- этапы команды (номера каталогов договорены участниками) ---
  01_requirements: analysis/requirements/   # analyst: requirements.json, Gherkin, вопросы
  02_system: analysis/system/               # system_architect: OpenAPI, AsyncAPI, DDL, SA-документ
  03_ux: design/                            # ux_designer: спеки экранов, потоки, docs интерфейса
  04_backend: 04_backend/                   # backend_coder (участник 3): имя каталога сохраняется —
                                            # на него ссылаются .gitlab-ci.yml и compose (../04_backend)
  05_web: web/                              # frontend_coder: web/admin — Angular-проект
  06_android: android/
  07_tests: reports/tests/                  # отчёты тестов и безопасности (JUnit, SARIF, Trivy)
  08_infra:                                 # devops (участник 3): compose остаётся в 08_infra/
    dir: 08_infra/                          # (относительные пути ./db-init, ../04_backend), в корень —
    root: [.gitlab-ci.yml]                  # только .gitlab-ci.yml
  09_docs:                                  # tech_writer: mkdocs.yml и docs/ — в корень
    dir: .
    exclude: [gate_report.json, gate_result.json, gate-result.json, metrics.jsonl, docs-text.json]

  # --- имена этапов по умолчанию (для агентов без номера) ---
  profile: analysis/profile/
  analysis: analysis/        # анализ требований, системный анализ
  ux: design/                # потоки, экраны, макеты и их исходники
  api: docs/api/             # OpenAPI / AsyncAPI и описание API
  adr: docs/adr/
  services: docs/services/
  db: db/                    # схема, миграции, тестовые данные
  backend: backend/
  web: web/
  mobile: android/
  android: android/
  mocks: mocks/              # mock-сервисы недоступных интеграций
  tests: tests/
  e2e: e2e/                  # демо-сценарий: e2e/run.sh запускает приёмщик
  security: docs/security/   # отчёт по безопасности, отчёты Trivy
  infra:
    dir: infra/
    root: &root_files
      - .gitlab-ci.yml
      - docker-compose.yml
      - docker-compose.*.yml
      - compose.yml
      - compose.*.yml
      - .env.example
      - Makefile
  devops:
    dir: infra/
    root: *root_files
  ci: .                      # этап целиком в корне
  docs:                      # продуктовая, пользовательская и техническая документация
    dir: docs/
    root: [README.md]
  acceptance: docs/report/acceptance/   # verdict.json и summary.md приёмщика

# Отчёт о прогоне (report.md, report.json, графики) и verdict.json.
report: docs/report/

# Целевая ветка merge request.
target_branch: main

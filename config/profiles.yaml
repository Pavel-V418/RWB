# Переопределения профилей генерации (specforge/llm/profiles.py).
# Путь берётся из LLM_PROFILES_PATH; относительный — от корня проекта.
# Поля: thinking, temperature, top_p, top_k, max_tokens, presence_penalty, timeout_s.
# Указывайте только меняемые; новый профиль получает незаданные поля по умолчанию.
# timeout_s не задан — max_tokens / LLM_MIN_TOKENS_PER_S + 60.
# С thinking: true температура ниже 0.5 запрещена (поднимается до 0.6).
# top_p/top_k — рекомендации для Qwen3; сверить с model card Qwen3.8.
profiles:
  ANALYSIS:
    thinking: true
    temperature: 0.6
    top_p: 0.95
    max_tokens: 16384
  REVIEW:
    thinking: true
    temperature: 0.6
    top_p: 0.95
    max_tokens: 8192
  CODE:
    thinking: false
    temperature: 0.2
    top_p: 0.8
    max_tokens: 8192
  REPAIR:
    thinking: false
    temperature: 0.1
    max_tokens: 4096

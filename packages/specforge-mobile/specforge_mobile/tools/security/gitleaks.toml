# Правила gitleaks по умолчанию + исключение папок, которые не являются кодом продукта.
[extend]
useDefault = true

[allowlist]
description = "сторонние и сгенерированные каталоги"
paths = [
  '''(^|[\\/])\.venv[\\/]''',
  '''(^|[\\/])node_modules[\\/]''',
  '''(^|[\\/])build[\\/]''',
  '''(^|[\\/])\.gradle[\\/]''',
  '''(^|[\\/])team_inputs[\\/]''',
  '''(^|[\\/])07_tests[\\/]raw[\\/]''',
  '''\.(png|jpg|jar|apk|zip)$''',
]

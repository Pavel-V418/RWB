[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specforge-backend"
version = "0.1.0"
description = "SpecForge, участник 3: каркас backend (.NET 10), генераторы из контрактов, backend- и DevOps-агенты"
requires-python = ">=3.11"
# генераторы и агенты — stdlib + pyyaml; .NET SDK 10 и Docker нужны на хосте
dependencies = ["pyyaml>=6.0"]

[tool.setuptools.packages.find]
include = ["specforge_backend*"]

[tool.setuptools.package-data]
specforge_backend = ["*/*.cs", "*/*.md"]

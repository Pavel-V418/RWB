# Обязательные документы и их разделы — проверка приёмщика (agents/acceptance).
# Перечень — требования кейса (этап 7); разделы — регламенты организаторов, по которым пишет
# документацию часть анализа (packages/specforge-analysis): «Правила проектирования и ведения
# документации по системному анализу» (шаблон ТЗ), шаблоны API, ADR и описания сервисов.
# Варианты через | — совпадение по вхождению в любой заголовок, без учёта регистра.
#
# Поля шаблона:
#   title     — название для вердикта;
#   paths     — glob-шаблоны файлов в итоговом репозитории (по умолчанию docs/<ключ>/**/*);
#   exclude   — имена файлов, которые не проверяются (fnmatch: index.md);
#   sections  — заголовки, которые должны быть в каждом .md; неприменимый раздел оставьте
#               с обоснованием, не удаляйте; пусто — проверяется только наличие документа;
#   keys      — ключи верхнего уровня для .yaml/.json (OpenAPI);
#   patterns  — {название: regex}, которые должны встречаться в тексте документа;
#   required  — false: документ желателен, его отсутствие — не «не сделано».
templates:
  system_analysis:
    title: Документ системного анализа
    paths:
      - docs/system-analysis*.md
      - analysis/**/*system*analys*.md
      - analysis/**/*системн*анализ*.md
      - docs/analysis/**/*.md
    sections:
      # разделы шаблона ТЗ организаторов + обязательный состав из требований кейса (этап 2)
      - Общие положения|Назначение|Purpose
      - Условия и ограничения|Границы|Scope
      - Сценарии использования|UseCase|Пользовательские сценарии
      - Диаграммы|Diagram
      - Функциональные требования|Functional requirements
      - Описание Frontend|Интерфейс пользователя|Компонент
      - Модель данных|Data model
      - Описание API|API
      - Интеграции|События|Integrations
      - Нефункциональные требования|Non-functional requirements
      - Требования к безопасности|Security
      - Критерии приемки|Критерии приёмки|Критерии успеха|Acceptance criteria
      - Допущения|Открытые вопросы|Assumptions
      - Трассируемост|Traceability
    patterns:
      идентификаторы функциональных требований: '\b(FR|ФТ)-?\d+'

  product:
    title: Продуктовое описание
    paths: [docs/index.md, docs/product*.md, docs/product/**/*.md, docs/продукт*.md]
    sections:
      - Проблема|Назначение|Purpose|Problem
      - Для кого|Пользовател|Роли|Users
      - Ценность|Value
      - Возможности|Функции|Features

  architecture:
    title: Описание архитектуры
    paths: [docs/architecture*.md, docs/architecture/**/*.md, docs/архитектур*.md]
    sections:
      - Компонент|Components
      - Решени|Decision
      - Жизненный цикл|Последовательност|Взаимодейств|Диаграмм|Sequence

  api:
    title: Описание API (OpenAPI)
    paths: [docs/contracts/openapi*.yaml, docs/contracts/openapi*.json, docs/api/**/*.yaml, analysis/**/openapi*.yaml]
    keys: [openapi, info, paths, components]

  api_methods:
    title: Описание методов API (шаблон API)
    paths: [docs/api-methods/*.md, analysis/**/api-methods/*.md]
    exclude: [index.md]
    sections:
      - Назначение
      - Входные данные
      - Выходные данные
      - Алгоритм
    required: false

  data_model:
    title: Модель данных
    paths: [docs/data-model*.md, docs/data_model*.md, docs/data-model/**/*.md]
    sections: []

  run_guide:
    title: Инструкция по запуску
    paths: [README.md, docs/run*.md, docs/deploy*.md, docs/запуск*.md]
    sections:
      - Требования|Предварительн|Prerequisites|Requirements|Общий порядок
      - Запуск|Run|Quick start|Getting started
      - Переменные окружения|Окружени|Environment|Configuration
      - Миграц|Migrations
      - Тестовые данные|Демо-данные|Seed|Test data
      - Проверка|Health|Работоспособност|Verify

  user_guide:
    title: Руководство пользователя
    paths: [docs/user*guide*.md, docs/user/**/*.md, docs/руководство*пользоват*.md]
    sections:
      - Начать работу|Начало работы|Вход|Getting started
      - пошло не так|Ошибки|Вопросы|FAQ|Troubleshooting

  dev_guide:
    title: Руководство по дальнейшей разработке
    paths:
      - docs/dev*guide*.md
      - docs/development*.md
      - docs/developer/**/*.md
      - docs/руководство*разработ*.md
      - CONTRIBUTING.md
    sections:
      - Где что лежит|Структура|Structure
      - добавить|изменить функцию|Расширен|Extending|Adding
      - Соглашени|Conventions

  test_report:
    title: Отчёт о тестировании
    required: false  # приёмщик всегда пишет свой (docs/report/acceptance/test-report.md)
    paths: [docs/test*report*.md, docs/testing/**/*.md, docs/отчет*тест*.md]
    sections: []

  security_report:
    title: Отчёт о проверке безопасности
    required: false  # приёмщик всегда пишет свой (docs/report/acceptance/security-report.md)
    paths: [docs/security-report*.md, docs/security/**/*.md]
    sections: []

  limitations:
    title: Перечень известных ограничений
    paths: [docs/*limitation*.md, docs/*ограничени*.md, docs/limitations/**/*.md]
    sections:
      - Ограничени|Limitations

  adr:
    title: Архитектурные решения (шаблон ADR)
    paths: [docs/adr/*.md]
    exclude: [index.md]
    required: false
    sections:
      - Контекст|Context
      - Статус|Status
      - Альтернатив|Alternatives
      - Принятое решение|Решение|Decision
      - Последствия|Consequences

  services:
    title: Описание сервисов (шаблон описания сервисов)
    paths: [docs/services/*.md]
    exclude: [index.md]
    required: false
    sections:
      - Описание|Purpose|Overview
      - Сборка|Build
      - Деплой|Deployment|Запуск
      - Конфигурац|Configuration
      - Мониторинг|Health|Metrics
      - Логирование|Logging

openapi: 3.1.0
info:
  title: Система учёта выдачи и возврата инструмента API
  version: 1.0.0
  description: |-
    Система для учёта выдачи и возврата дорогостоящего инструмента и оборудования со склада технических служб. Она позволяет вести каталог, бронировать, выдавать и возвращать инструмент с фиксацией состояния, а также передавать события в корпоративную систему учёта ТМЦ.

    Сгенерировано specforge-analysis из доменной модели и дизайна API.
servers:
- url: http://localhost:8080
  description: локальный запуск (docker compose)
tags:
- name: Tools
- name: Reservations
- name: IssueRecords
- name: ReturnRecords
- name: MovementHistory
- name: EmployeeImports
- name: Employees
- name: SyncOperations
- name: SystemSettings
- name: AuditLogs
- name: Users
security:
- bearerAuth: []
paths:
  /api/v1/tools:
    post:
      operationId: createTool
      summary: Добавить инструмент в каталог
      tags:
      - Tools
      x-requirements:
      - FR-1
      - FR-2
      - FR-12
      x-roles:
      - warehouse_manager
      description: 'Роли: warehouse_manager. Требования: FR-1, FR-2, FR-12.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateToolRequest'
      responses:
        '201':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tool'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listTools
      summary: Получить список инструментов
      tags:
      - Tools
      x-requirements:
      - FR-1
      x-roles:
      - warehouse_manager
      - warehouse_keeper
      - employee
      description: 'Роли: warehouse_manager, warehouse_keeper, employee. Требования: FR-1.'
      security:
      - bearerAuth: []
      parameters:
      - name: category
        in: query
        required: false
        description: ''
        schema:
          type: string
          maxLength: 255
      - name: warehouse
        in: query
        required: false
        description: ''
        schema:
          type: string
          maxLength: 255
      - name: status
        in: query
        required: false
        description: ''
        schema:
          type: string
          enum:
          - available
          - issued
          - reserved
          - repair
          - lost
          - retired
      - name: page
        in: query
        required: false
        description: Номер страницы
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        required: false
        description: Размер страницы
        schema:
          type: integer
          format: int32
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - page
                - pageSize
                - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tool'
                  page:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 200
                  total:
                    type: integer
                    minimum: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tools/{id}:
    get:
      operationId: getTool
      summary: Получить инструмент по ID
      tags:
      - Tools
      x-requirements:
      - FR-1
      x-roles:
      - warehouse_manager
      - warehouse_keeper
      - employee
      description: 'Роли: warehouse_manager, warehouse_keeper, employee. Требования: FR-1.'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tool'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':

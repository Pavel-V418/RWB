      - warehouse_keeper
      - employee
      description: 'Роли: warehouse_manager, warehouse_keeper, employee. Требования: FR-4.'
      security:
      - bearerAuth: []
      parameters:
      - name: toolId
        in: query
        required: false
        description: ''
        schema:
          type: string
          format: uuid
      - name: employeeId
        in: query
        required: false
        description: ''
        schema:
          type: string
          format: uuid
      - name: date
        in: query
        required: false
        description: ''
        schema:
          type: string
          format: date
      - name: status
        in: query
        required: false
        description: ''
        schema:
          type: string
          enum:
          - active
          - cancelled
          - fulfilled
      - name: page
        in: query
        required: false
        description: ''
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        required: false
        description: ''
        schema:
          type: integer
          format: int32
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - page
                - pageSize
                - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reservation'
                  page:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 200
                  total:
                    type: integer

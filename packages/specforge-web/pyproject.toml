[project]
name = "specforge-web"
version = "0.1.0"
description = "SpecForge, участник 4: UX-агент, генератор Angular-админки, frontend-агент, UI-ревьюер"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.20",
  "pillow>=10",
]

[project.optional-dependencies]
# UI-ревьюер (agents/vlm_reviewer): Playwright + Chromium
review = ["playwright>=1.45"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["specforge_web"]

[tool.pytest.ini_options]
testpaths = ["specforge_web/tests"]

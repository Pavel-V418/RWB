# --- Параметры кейса (меняет конвейер, не агент) ---
specforge.appId=com.specforge.case1
specforge.appName=Парковка СПб
# Prism mock на хосте, видимом из эмулятора; на стенде подставляется $STAND_URL
specforge.apiBaseUrl=http://10.0.2.2:4010/
# true — геолокация из assets/mock_route/points.json вместо GPS
specforge.mockRoute=true
# Ускорение времени, должно совпадать с TIME_SCALE backend
specforge.timeScale=10

# --- Экономия памяти: vm5 и раннеры имеют ~4 ГБ RAM ---
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx768m
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
